# ------------------------------------------------------------------
# nginx — پرده آنتیک (Next.js 16 + Express)
#
# نصب:
#   cp deploy/nginx/antic.conf /etc/nginx/sites-available/antic
#   ln -sf /etc/nginx/sites-available/antic /etc/nginx/sites-enabled/antic
#   nginx -t && systemctl reload nginx
#
# معماری: همه‌چیز به Next.js (:3000) می‌رود.
# Next.js خودش /api و /uploads و /sitemap.xml و /robots.txt و
# /.well-known/* را به بک‌اند (:3001) پروکسی می‌کند.
# ------------------------------------------------------------------

upstream antic_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name pardehantic.ir www.pardehantic.ir;

    # برای Cloudflare / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pardehantic.ir www.pardehantic.ir;

    # --- گواهی SSL (مسیرها را با مسیر واقعی letsencrypt جایگزین کنید) ---
    ssl_certificate     /etc/letsencrypt/live/pardehantic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pardehantic.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # آپلود تصویر و server actions
    client_max_body_size 25m;

    # --- هدرهای امنیتی ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- کش فایل‌های استاتیک Next.js ---
    location /_next/static/ {
        proxy_pass http://antic_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- فایل‌های آپلودی: مستقیم از دیسک (سریع‌تر از پروکسی دوباره) ---
    location /uploads/ {
        alias /var/www/antic/backend/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # --- همه‌چیز دیگر → Next.js ---
    location / {
        proxy_pass http://antic_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/antic.access.log;
    error_log  /var/log/nginx/antic.error.log;
}
