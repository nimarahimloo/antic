services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js rewrites are compiled at build time.
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "file:/app/data/dev.db"
      UPLOAD_DIR: "./uploads"
      AI_PRIVATE_DIR: "/app/data/ai"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
