services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js rewrites را در زمان build ثابت می‌کند
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: "3001"
      # مسیر مطلق: Prisma مسیر نسبی SQLite را نسبت به فایل schema حساب می‌کند
      DATABASE_URL: "file:/app/data/dev.db"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      UPLOAD_DIR: "./uploads"
      AI_PRIVATE_DIR: "/app/data/ai"
      MCP_WORKER_TOKEN: ${MCP_WORKER_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-nvidia-m}
      AI_ENABLE_CLOUDFLARE: ${AI_ENABLE_CLOUDFLARE:-true}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      AI_ENABLE_GOOGLE: ${AI_ENABLE_GOOGLE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_ENABLE_OPENROUTER: ${AI_ENABLE_OPENROUTER:-false}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2500}
      AI_DAILY_CHAT_REQUESTS: ${AI_DAILY_CHAT_REQUESTS:-50}
      AI_DAILY_IMAGE_REQUESTS: ${AI_DAILY_IMAGE_REQUESTS:-10}
      AI_DAILY_TOTAL_TOKENS: ${AI_DAILY_TOTAL_TOKENS:-200000}
      AI_CLOUDFLARE_DAILY_QUOTA_UNITS: ${AI_CLOUDFLARE_DAILY_QUOTA_UNITS:-9000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@antic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
